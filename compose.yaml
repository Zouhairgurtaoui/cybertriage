name: cybertriage

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend: &backend
  image: cybertriage-backend:local
  build: .
  init: true
  user: "10001:10001"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - application-data:/app/data
  configs:
    - source: sources
      target: /app/config/sources.yaml
    - source: triage
      target: /app/config/triage.yaml
    - source: auth_codes
      target: /app/config/windows-authentication-codes.json
  logging: *logging
  stop_grace_period: 210s

x-model-environment: &model-environment
  CYBERTRIAGE_OLLAMA_URL: http://ollama:11434
  CYBERTRIAGE_MODEL: "${CYBERTRIAGE_MODEL:-qwen3:4b-instruct}"
  CYBERTRIAGE_INDEXER_URL: "${CYBERTRIAGE_INDEXER_URL:?Configure a reachable certificate-matching Indexer URL}"
  CYBERTRIAGE_INDEXER_USERNAME: "${CYBERTRIAGE_INDEXER_USERNAME:?Configure the read-only Indexer username}"
  CYBERTRIAGE_INDEXER_CA_BUNDLE: /run/indexer-ca.pem
  CYBERTRIAGE_INDEXER_PASSWORD_FILE: /run/secrets/indexer_password
  CYBERTRIAGE_INDEXER_FORWARD_HOST: "${CYBERTRIAGE_INDEXER_FORWARD_HOST:-}"
  CYBERTRIAGE_INDEXER_FORWARD_PORT: "${CYBERTRIAGE_INDEXER_FORWARD_PORT:-}"
  ANONYMIZED_TELEMETRY: "False"

services:
  bootstrap:
    <<: *backend
    user: "0:0"
    restart: "no"
    entrypoint: [python, /app/docker/bootstrap.py]
    configs: []
    volumes:
      - application-data:/app/data
      - api-tls:/run/api-tls
      - public-trust:/run/public-trust
    cap_drop: []
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]

  ollama:
    image: "${CYBERTRIAGE_OLLAMA_IMAGE:-ollama/ollama:0.40.17}"
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_MAX_QUEUE: "16"
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NOPRUNE: "true"
    volumes:
      - type: bind
        source: "${CYBERTRIAGE_OLLAMA_MODELS_DIRECTORY:?Set the existing Ollama models directory}"
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - ollama-home:/root/.ollama
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 14g
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  ingestion:
    <<: *backend
    command: [serve, --host, 0.0.0.0, --port, "8000"]
    environment:
      CYBERTRIAGE_INGEST_TOKEN_FILE: /run/secrets/ingestion_token
    secrets: [ingestion_token]
    ports:
      - "127.0.0.1:${CYBERTRIAGE_INGEST_PORT:-8000}:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, /app/docker/healthcheck.py, ingestion]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  analyst-api:
    <<: *backend
    env_file:
      - path: ./config/firewall.local.env
        required: false
    command: [serve-analyst, --host, 0.0.0.0, --port, "8001", --tls-certificate, /run/api-tls/analyst.pem, --tls-key, /run/api-tls/analyst-key.pem]
    environment:
      CYBERTRIAGE_INGEST_TOKEN_FILE: /run/secrets/ingestion_token
      CYBERTRIAGE_GRAPH_NAMESPACE: "${CYBERTRIAGE_GRAPH_NAMESPACE:-cybertriage-docker}"
    secrets: [ingestion_token]
    configs:
      - source: analysts
        target: /app/config/analysts.local.yaml
      - source: response_policy
        target: /app/config/response_actions.yaml
      - source: firewalls
        target: /app/config/firewalls.yaml
    volumes:
      - application-data:/app/data
      - api-tls:/run/api-tls:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, /app/docker/healthcheck.py, analyst]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *backend
    command: [worker, --investigate]
    environment: *model-environment
    secrets: [indexer_password]
    volumes:
      - application-data:/app/data
      - type: bind
        source: "${CYBERTRIAGE_INDEXER_CA_PATH:?Set the public Indexer CA file}"
        target: /run/indexer-ca.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      ingestion:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /app/docker/healthcheck.py, worker]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  investigation-worker:
    <<: *backend
    command: [investigation-worker]
    environment: *model-environment
    secrets: [indexer_password]
    volumes:
      - application-data:/app/data
      - type: bind
        source: "${CYBERTRIAGE_INDEXER_CA_PATH:?Set the public Indexer CA file}"
        target: /run/indexer-ca.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      analyst-api:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /app/docker/healthcheck.py, worker]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  response-expiry-worker:
    <<: *backend
    env_file:
      - path: ./config/firewall.local.env
        required: false
    command: [response-expiry-worker]
    configs:
      - source: response_policy
        target: /app/config/response_actions.yaml
      - source: firewalls
        target: /app/config/firewalls.yaml
    depends_on:
      analyst-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /app/docker/healthcheck.py, worker]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  analyst-web:
    build:
      context: ./apps/analyst-web
      args:
        NODE_IMAGE: "${CYBERTRIAGE_NODE_IMAGE:-node:26-slim}"
    image: cybertriage-analyst-web:local
    restart: unless-stopped
    environment:
      ANALYST_API_UPSTREAM: https://analyst-api:8001
      ANALYST_API_TLS_NAME: analyst-api
      ANALYST_API_CA_FILE: /run/public-trust/ca.pem
    ports:
      - "127.0.0.1:${CYBERTRIAGE_WEB_PORT:-5173}:8080"
    volumes:
      - public-trust:/run/public-trust:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      analyst-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *logging

  neo4j:
    profiles: [graph]
    image: "${CYBERTRIAGE_NEO4J_IMAGE:-neo4j:5.26-community}"
    init: true
    user: "7474:7474"
    restart: unless-stopped
    entrypoint: [/bin/bash, -c]
    command:
      - 'export NEO4J_AUTH="neo4j/$$(cat /run/secrets/neo4j_password)"; exec /startup/docker-entrypoint.sh neo4j'
    secrets: [neo4j_password]
    environment:
      NEO4J_server_bolt_listen__address: 127.0.0.1:7687
      NEO4J_server_http_enabled: "false"
      NEO4J_server_https_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-conf:/conf
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    healthcheck:
      test: [CMD-SHELL, 'NEO4J_PASSWORD="$$(cat /run/secrets/neo4j_password)" cypher-shell -a bolt://127.0.0.1:7687 -u neo4j --access-mode read "RETURN 1;" >/dev/null']
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 60s
    logging: *logging

  neo4j-schema:
    <<: *backend
    profiles: [graph]
    restart: "no"
    network_mode: service:neo4j
    extra_hosts: []
    command: [graph-schema]
    environment:
      CYBERTRIAGE_NEO4J_URI: bolt://127.0.0.1:7687
      CYBERTRIAGE_NEO4J_USERNAME: neo4j
      CYBERTRIAGE_NEO4J_DATABASE: neo4j
      CYBERTRIAGE_NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
    secrets: [neo4j_password]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy

  graph-worker:
    <<: *backend
    profiles: [graph]
    network_mode: service:neo4j
    extra_hosts: []
    command: [graph-worker]
    environment:
      CYBERTRIAGE_NEO4J_URI: bolt://127.0.0.1:7687
      CYBERTRIAGE_NEO4J_USERNAME: neo4j
      CYBERTRIAGE_NEO4J_DATABASE: neo4j
      CYBERTRIAGE_GRAPH_NAMESPACE: "${CYBERTRIAGE_GRAPH_NAMESPACE:-cybertriage-docker}"
      CYBERTRIAGE_NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
    secrets: [neo4j_password]
    depends_on:
      analyst-api:
        condition: service_healthy
      neo4j-schema:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, /app/docker/healthcheck.py, worker]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *logging

  import-data:
    <<: *backend
    profiles: [maintenance]
    user: "0:0"
    restart: "no"
    configs: []
    entrypoint: [python, /app/docker/import_data.py]
    volumes:
      - application-data:/app/data
      - type: bind
        source: ./data
        target: /import
        read_only: true
        bind:
          create_host_path: false
    cap_drop: []
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]

configs:
  sources:
    file: ./config/sources.yaml
  triage:
    file: ./config/triage.yaml
  auth_codes:
    file: ./config/windows-authentication-codes.json
  analysts:
    file: "${CYBERTRIAGE_ANALYSTS_CONFIG:-./config/analysts.local.yaml}"
  response_policy:
    file: "${CYBERTRIAGE_RESPONSE_CONFIG:-./config/response_actions.yaml}"
  firewalls:
    file: "${CYBERTRIAGE_FIREWALLS_CONFIG:-./config/firewalls.yaml}"

secrets:
  ingestion_token:
    file: "${CYBERTRIAGE_INGEST_TOKEN_PATH:-./config/secrets/ingestion.token}"
  indexer_password:
    file: "${CYBERTRIAGE_INDEXER_PASSWORD_PATH:-./config/secrets/indexer.password}"
  neo4j_password:
    file: "${CYBERTRIAGE_NEO4J_PASSWORD_PATH:-./config/secrets/neo4j.password}"

volumes:
  application-data:
  api-tls:
  public-trust:
  ollama-home:
  neo4j-data:
  neo4j-logs:
  neo4j-conf:
