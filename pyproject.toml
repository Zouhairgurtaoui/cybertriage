[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertriage"
version = "0.1.0"
description = "Evidence-based investigation of Wazuh security alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cybertriage = "cybertriage.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cybertriage*"]