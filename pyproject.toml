[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertriage"
version = "0.1.0"
description = "Evidence-based investigation of Wazuh security alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "langchain-text-splitters>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-chroma>=0.2,<2",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1,<2",
    "langchain-core>=1,<2",
    "pydantic>=2.7,<3",
]

[project.scripts]
cybertriage = "cybertriage.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cybertriage*"]
